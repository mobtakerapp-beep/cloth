<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Clothes Game – Oman</title>
<style>
:root{color-scheme:light;--red:#c8102e;--green:#0a7d3b;--cream:#fff7e6;--gold:#c9962b;--ink:#2b1d14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><path d='M30 4l8 26-8 26-8-26z' fill='none' stroke='%23c9962b' stroke-opacity='.25' stroke-width='2'/><path d='M4 30l26-8 26 8-26 8z' fill='none' stroke='%23c9962b' stroke-opacity='.25' stroke-width='2'/></svg>");font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);text-align:center}
.band{height:18px;background:repeating-linear-gradient(90deg,var(--red) 0 18px,#fff 18px 24px,var(--green) 24px 42px,#fff 42px 48px)}
header{background:var(--red);color:#fff;padding:12px;font-size:22px;font-weight:bold;border-bottom:5px solid var(--gold)}
header small{display:block;font-size:14px;font-weight:normal;opacity:.9}
main{max-width:520px;margin:0 auto;padding:14px 14px 150px}
.card{background:#fff;border:4px solid var(--gold);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--green),0 10px 18px #0003}
.pic{width:190px;height:190px;object-fit:contain;display:block;margin:0 auto}
.q{font-size:24px;font-weight:bold;margin:8px 0 12px}
.say{background:none;border:0;font-size:28px;cursor:pointer}
.opt{display:block;width:100%;margin:9px 0;padding:13px;font-size:22px;font-weight:bold;border:3px solid var(--green);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}
.opt.ok{background:var(--green);color:#fff}.opt.bad{background:var(--red);color:#fff;border-color:var(--red)}
.go{background:var(--red);color:#fff;border:0;border-radius:16px;padding:12px 30px;font-size:22px;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 #7d0a1c}
.bar{height:12px;background:#0002;border-radius:8px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.ar{direction:rtl;font-size:19px;margin:6px 0;color:var(--green);font-weight:bold}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.row img{width:64px;height:64px;object-fit:contain;background:#fff;border:2px solid var(--gold);border-radius:12px}
.fort{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;z-index:0}
.fort svg{width:100%;height:100%;display:block}
main{position:relative;z-index:1}
</style></head><body>
<div class="band"></div>
<header>🇴🇲 The Clothes Game <small>مرحبًا بكم في لعبة الملابس</small></header>
